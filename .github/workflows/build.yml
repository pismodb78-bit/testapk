# Сборка APK на каждый пуш.
#
# Зачем: до этого проверить, что проект вообще собирается, можно было только
# руками в Android Studio — ошибки компиляции всплывали через полчаса после
# правки. Здесь они видны сразу, а готовый debug-APK можно скачать из вкладки
# Actions и поставить на телефон, не собирая ничего локально.
name: Сборка

on:
  push:
    paths-ignore:
      - '**.md'
      - 'sql/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Кеш Gradle: без него каждая сборка заново тянет AGP, Compose и SDK.
      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Собрать debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pismo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
