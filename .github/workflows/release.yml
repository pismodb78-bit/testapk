# Релиз: подписанный APK + Release на GitHub, откуда приложение обновляет себя.
#
# Как выпустить версию:
#   git tag v1.2 && git push origin v1.2
# Дальше всё само: версия считается из тега (v1.2 → versionName 1.2,
# versionCode 10200), APK подписывается ключом из секретов и прикладывается к
# релизу. Приложение видит его через api.github.com/.../releases/latest — см.
# core/Updater.kt.
#
# ОДИН РАЗ НУЖНО ПОЛОЖИТЬ КЛЮЧ В СЕКРЕТЫ РЕПОЗИТОРИЯ (Settings → Secrets and
# variables → Actions):
#
#   keytool -genkeypair -v -keystore pismo.jks -alias pismo \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 pismo.jks > pismo.jks.b64      # на macOS: base64 -i pismo.jks
#
#   PISMO_KEYSTORE_BASE64    — содержимое pismo.jks.b64
#   PISMO_KEYSTORE_PASSWORD  — пароль хранилища
#   PISMO_KEY_ALIAS          — pismo
#   PISMO_KEY_PASSWORD       — пароль ключа (обычно тот же)
#
# Сам pismo.jks храните у себя и не теряйте: без него выпустить обновление,
# которое встанет поверх установленного, будет уже нечем.
name: Релиз

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.2'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Версия из тега
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          IFS='.' read -r A B C <<< "$NAME"
          # versionCode обязан расти: 1.2 → 10200, 1.2.3 → 10203.
          CODE=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Достать ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.PISMO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета PISMO_KEYSTORE_BASE64 — подписать релиз нечем."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pismo.jks"

      - name: Собрать подписанный APK
        env:
          PISMO_KEYSTORE: ${{ runner.temp }}/pismo.jks
          PISMO_KEYSTORE_PASSWORD: ${{ secrets.PISMO_KEYSTORE_PASSWORD }}
          PISMO_KEY_ALIAS: ${{ secrets.PISMO_KEY_ALIAS }}
          PISMO_KEY_PASSWORD: ${{ secrets.PISMO_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PpismoVersionName='${{ steps.ver.outputs.name }}' \
            -PpismoVersionCode='${{ steps.ver.outputs.code }}'

      - name: Назвать по-человечески
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "pismo-${{ steps.ver.outputs.name }}.apk"

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PISMO ${{ steps.ver.outputs.name }}
          files: pismo-*.apk
          generate_release_notes: true
