name: APK Release в ветку

on:
  push:
    branches:
      - claude/pismo-android-version-qd5fxr
    paths:
      - 'app/**'
      - '.github/workflows/release-apk-branch.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pismo-android-version-qd5fxr

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Firebase настройки, если заданы
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > app/google-services.json
          fi

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.PISMO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета PISMO_KEYSTORE_BASE64 — Release APK не будет подписан."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pismo.jks"

      - name: Собрать Release APK
        env:
          PISMO_KEYSTORE: ${{ runner.temp }}/pismo.jks
          PISMO_KEYSTORE_PASSWORD: ${{ secrets.PISMO_KEYSTORE_PASSWORD }}
          PISMO_KEY_ALIAS: ${{ secrets.PISMO_KEY_ALIAS }}
          PISMO_KEY_PASSWORD: ${{ secrets.PISMO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PpismoVersionName=1.7.23 -PpismoVersionCode=107023

      - name: Коммит APK в Android-ветку
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/pismo-1.7.23.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/pismo-1.7.23.apk
          git commit -m "APK Release 1.7.23"
          git push origin HEAD:claude/pismo-android-version-qd5fxr
